<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="1.5 years in DFIR at Tata Consultancy Services. Disk: E01 / AFF4 / RAW acquisition, Windows forensics, Linux forensics. Mobile: Cellebrite UFED, Cellebrite PA, Manual SQLite carving, Deleted-record recovery. Response: Endpoint forensics, Incident response, Log analysis, Timeline correlation. Suites: Magnet AXIOM, FTK, OpenText, EZ Tools, Splunk. Stack: Python, SQLite, Bash, Linux, Windows">
