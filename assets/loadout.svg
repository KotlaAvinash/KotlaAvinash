<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="1.5 years in DFIR. Suites: Cellebrite UFED, Cellebrite PA, Magnet AXIOM, FTK, OpenText, EZ Tools. Disciplines: mobile forensics, endpoint forensics, incident response, log analysis. Stack: Splunk, Python, SQLite, Bash, Linux, Windows.">
  <style>
    .blink { animation: blink 1.1s infinite steps(1); }
    @keyframes blink { 0%,50% { opacity:1 } 51%,100% { opacity:0 } }
  </style>
  <defs><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" opacity="0.035"/>
    </pattern><clipPath id="frame"><rect width="1000" height="300" rx="14"/></clipPath></defs>
  <g clip-path="url(#frame)">
    <rect width="1000" height="300" fill="#08080B"/>
    <rect width="1000" height="300" fill="url(#scan)"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="299" rx="14" fill="none" stroke="#22242E"/>

  <text x="40" y="44" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="11" letter-spacing="4" fill="#62656F">LOADOUT</text>

  <!-- experience -->
  <text x="38" y="150" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="-2" fill="#F2F2F5">1.5</text>
  <text x="40" y="184" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="12" letter-spacing="3" fill="#FF2E4D">YEARS IN DFIR<tspan class="blink">_</tspan></text>
  <rect x="40" y="204" width="200" height="3" rx="1.5" fill="#22242E"/>
  <rect class="fill" x="40" y="204" width="200" height="3" rx="1.5" fill="#FF2E4D"/>
  <text x="40" y="236" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="11" fill="#8A8D99">mobile · endpoint · IR</text>
  <text x="40" y="256" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="11" fill="#8A8D99">acquisition → timeline</text>

  <rect x="268" y="40" width="1" height="220" fill="#22242E"/>

