<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="whoami: Digital Forensic Analyst at Tata Consultancy Services. End-to-end investigations across Windows, Linux and mobile, from evidence acquisition and chain of custody through analysis to the final report. The core of the work is correlation: logs, artifacts and device evidence brought together into one timeline that can be defended. When a tool doesn&#x27;t exist for the artifact in front of me, I build one. Workflow: acquire, custody, analyse, correlate, timeline, report.">
  <style>
    .flow { animation: flow 1.6s linear infinite; }
    .ring { animation: ring 2.4s ease-out infinite; }
    .blink { animation: blink 1.1s infinite steps(1); }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    @keyframes ring { 0% { transform: scale(1); opacity:.8 } 100% { transform: scale(2); opacity:0 } }
    @keyframes blink { 0%,50% { opacity:1 } 51%,100% { opacity:0 } }
  </style>
  <defs><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" opacity="0.035"/>
    </pattern>
    <radialGradient id="glow" cx="0%" cy="0%" r="70%">
      <stop offset="0" stop-color="#1FA8FF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#1FA8FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1000" height="360" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1000" height="360" fill="#05080F"/>
    <rect width="1000" height="360" fill="url(#glow)"/>
    <rect width="1000" height="360" fill="url(#scan)"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="359" rx="14" fill="none" stroke="#1A2740"/>

  <!-- watermark monogram -->
  <text x="952" y="236" text-anchor="end" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="190" font-weight="800" letter-spacing="-6" fill="none" stroke="#10223D" stroke-width="2">KA</text>
  <rect x="742" y="252" width="200" height="1" fill="#0E3A66"/>

  <text x="40" y="44" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="11" letter-spacing="4" fill="#5A6A88">~/WHOAMI<tspan class="blink" fill="#1FA8FF">_</tspan></text>

  <text x="40" y="92" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" fill="#EAF4FF">Digital Forensic Analyst</text>
  <rect x="40" y="108" width="7" height="7" fill="#1FA8FF" transform="rotate(45 43.5 111.5)"/>
  <text x="56" y="116" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="12" letter-spacing="3" fill="#1FA8FF">TATA CONSULTANCY SERVICES</text>

  <text x="40" y="156" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#C3CEE0">End-to-end investigations across Windows, Linux and mobile, from evidence acquisition and</text><text x="40" y="180" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#C3CEE0">chain of custody through analysis to the final report. The core of the work is correlation:</text><text x="40" y="204" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#C3CEE0">logs, artifacts and device evidence brought together into one timeline that can be defended.</text><text x="40" y="228" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#EAF4FF">When a tool doesn&#x27;t exist for the artifact in front of me, I build one.</text>

  <rect x="90" y="291.25" width="820" height="1.5" fill="#1A2740"/><path class="flow" d="M90 292 H910" stroke="#1FA8FF" stroke-width="1.5" stroke-dasharray="3 13" stroke-linecap="round"/><rect x="85.0" y="287" width="10" height="10" fill="#05080F" stroke="#1FA8FF" stroke-width="1.5" transform="rotate(45 90.0 292)"/><text x="90.0" y="322" text-anchor="middle" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="10.5" letter-spacing="2" fill="#8495B2">ACQUIRE</text><text x="90.0" y="274" text-anchor="middle" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="9.5" fill="#5A6A88">01</text><rect x="249.0" y="287" width="10" height="10" fill="#05080F" stroke="#1FA8FF" stroke-width="1.5" transform="rotate(45 254.0 292)"/><text x="254.0" y="322" text-anchor="middle" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="10.5" letter-spacing="2" fill="#8495B2">CUSTODY</text><text x="254.0" y="274" text-anchor="middle" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="9.5" fill="#5A6A88">02</text><rect x="413.0" y="287" width="10" height="10" fill="#05080F" stroke="#1FA8FF" stroke-width="1.5" transform="rotate(45 418.0 292)"/><text x="418.0" y="322" text-anchor="middle" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="10.5" letter-spacing="2" fill="#8495B2">ANALYSE</text><text x="418.0" y="274" text-anchor="middle" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="9.5" fill="#5A6A88">03</text><rect x="577.0" y="287" width="10" height="10" fill="#05080F" stroke="#1FA8FF" stroke-width="1.5" transform="rotate(45 582.0 292)"/><text x="582.0" y="322" text-anchor="middle" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="10.5" letter-spacing="2" fill="#8495B2">CORRELATE</text><text x="582.0" y="274" text-anchor="middle" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="9.5" fill="#5A6A88">04</text><rect x="741.0" y="287" width="10" height="10" fill="#05080F" stroke="#1FA8FF" stroke-width="1.5" transform="rotate(45 746.0 292)"/><text x="746.0" y="322" text-anchor="middle" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="10.5" letter-spacing="2" fill="#8495B2">TIMELINE</text><text x="746.0" y="274" text-anchor="middle" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="9.5" fill="#5A6A88">05</text><circle class="ring" cx="910.0" cy="292" r="11" fill="none" stroke="#1FA8FF" stroke-width="1.5" style="transform-origin:910.0px 292px"/><rect x="904.0" y="286" width="12" height="12" fill="#1FA8FF" transform="rotate(45 910.0 292)"/><text x="910.0" y="322" text-anchor="middle" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="10.5" letter-spacing="2" fill="#EAF4FF">REPORT</text><text x="910.0" y="274" text-anchor="middle" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="9.5" fill="#5A6A88">06</text>
</svg>
