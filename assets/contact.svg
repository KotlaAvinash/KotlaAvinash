<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="Kotla Avinash — digital forensics, incident response, tool building. Open to DFIR conversations.">
  <style>
    .blink { animation: blink 1.1s infinite steps(1); }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes blink { 0%,50% { opacity:1 } 51%,100% { opacity:0 } }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.25 } }
  </style>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" opacity="0.035"/>
    </pattern>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2E4D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF2E4D" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FF2E4D" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="60%">
      <stop offset="0" stop-color="#FF2E4D" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FF2E4D" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1000" height="150" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1000" height="150" fill="#08080B"/>
    <rect width="1000" height="150" fill="url(#glow)"/>
    <rect width="1000" height="150" fill="url(#scan)"/>
    <rect x="0" y="0" width="1000" height="2" fill="url(#rule)"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="149" rx="14" fill="none" stroke="#22242E"/>

  <rect x="496" y="22" width="8" height="8" fill="#FF2E4D" transform="rotate(45 500 26)"/>
  <text x="503" y="66" text-anchor="middle" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="7" fill="#F2F2F5">KOTLA AVINASH</text>
  <text x="501" y="90" text-anchor="middle" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="10.5" letter-spacing="3" fill="#8A8D99">DIGITAL FORENSICS  ·  INCIDENT RESPONSE  ·  TOOL BUILDING</text>

  <g font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="10.5" letter-spacing="2">
    <circle class="pulse" cx="396" cy="120" r="3.5" fill="#FF2E4D"/>
    <text x="408" y="124" fill="#8A8D99">OPEN TO DFIR CONVERSATIONS<tspan class="blink" fill="#FF2E4D">_</tspan></text>
  </g>
</svg>
