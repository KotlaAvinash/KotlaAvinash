<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="Evidence map: each artifact connects to the tool that reads it.">
  <style>
    .flow { animation: flow 1.6s linear infinite; }
    .ring { transform-origin: 500px 200px; animation: ring 2.4s ease-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    @keyframes ring { 0% { transform: scale(1); opacity:.7 } 100% { transform: scale(1.9); opacity:0 } }
  </style>
  <defs><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" opacity="0.035"/>
    </pattern><clipPath id="frame"><rect width="1000" height="400" rx="14"/></clipPath></defs>
  <g clip-path="url(#frame)">
    <rect width="1000" height="400" fill="#08080B"/>
    <rect width="1000" height="400" fill="url(#scan)"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="399" rx="14" fill="none" stroke="#22242E"/>

  <text x="500" y="36" text-anchor="middle" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="11" letter-spacing="4" fill="#62656F">EVIDENCE MAP</text>
  <text x="175" y="36" text-anchor="middle" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="10" letter-spacing="3" fill="#8A8D99">WINDOWS</text>
  <text x="825" y="36" text-anchor="middle" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="10" letter-spacing="3" fill="#8A8D99">DISK · MOBILE · KAPE</text>

