<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="WHITEDEVIL 1026 — digital forensics. Deleted is not gone.">
  <style>
    .g1 { animation: glitch 7s infinite steps(1); }
    .g2 { animation: glitch2 7s infinite steps(1); }
    .blink { animation: blink 1.1s infinite steps(1); }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes glitch { 0%,88%,100% { opacity:0; transform:translate(0,0) } 89% { opacity:.9; transform:translate(-5px,1px) } 91% { opacity:.9; transform:translate(4px,-2px) } 93% { opacity:0 } }
    @keyframes glitch2 { 0%,88%,100% { opacity:0; transform:translate(0,0) } 90% { opacity:.6; transform:translate(5px,2px) } 92% { opacity:.6; transform:translate(-3px,0) } 93% { opacity:0 } }
    @keyframes blink { 0%,50% { opacity:1 } 51%,100% { opacity:0 } }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.25 } }
  </style>
  <defs>
    <radialGradient id="glow" cx="50%" cy="58%" r="55%">
      <stop offset="0" stop-color="#FF2E4D" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FF2E4D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" opacity="0.035"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="320" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="320" fill="#08080B"/>
    <rect width="1000" height="320" fill="url(#glow)"/>
    <rect width="1000" height="320" fill="url(#scan)"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="319" rx="14" fill="none" stroke="#22242E"/>

  <!-- corner status -->
  <g font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="11" letter-spacing="2">
    <circle class="pulse" cx="36" cy="34" r="4" fill="#FF2E4D"/>
    <text x="48" y="38" fill="#8A8D99">ACQUIRING</text>
    <text x="964" y="38" text-anchor="end" fill="#62656F">DFIR // 1026</text>
  </g>

  <!-- wordmark with occasional glitch split -->
  <g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="74" font-weight="800" letter-spacing="16" text-anchor="middle">
    <text class="g1" x="508" y="168" fill="#FF2E4D">WHITEDEVIL</text>
    <text class="g2" x="508" y="168" fill="#7DF9FF" opacity="0">WHITEDEVIL</text>
    <text x="508" y="168" fill="#F2F2F5">WHITEDEVIL</text>
  </g>

  <!-- 1026 between rules -->
  <g>
    <rect x="370" y="196" width="88" height="1" fill="#5C1420"/>
    <text x="500" y="201" text-anchor="middle" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="13" letter-spacing="6" fill="#FF2E4D">1026</text>
    <rect x="542" y="196" width="88" height="1" fill="#5C1420"/>
  </g>

  <text x="500" y="248" text-anchor="middle" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="16" fill="#F2F2F5">deleted <tspan fill="#FF2E4D">≠</tspan> gone<tspan class="blink" fill="#FF2E4D">▌</tspan></text>
  <text x="500" y="280" text-anchor="middle" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="11" letter-spacing="3" fill="#62656F">FORENSIC TOOLS FOR WINDOWS · ANDROID · SQLITE · DISK IMAGES</text>
</svg>
