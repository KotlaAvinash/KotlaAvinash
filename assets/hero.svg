<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="KOTLA AVINASH — DFIR. Digital forensics, incident response, tool building. Deleted is not gone. Open to DFIR conversations.">
  <style>
    .g1 { animation: glitch 7s infinite steps(1); }
    .g2 { animation: glitch2 7s infinite steps(1); }
    .blink { animation: blink 1.1s infinite steps(1); }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes glitch { 0%,88%,100% { opacity:0; transform:translate(0,0) } 89% { opacity:.9; transform:translate(-5px,1px) } 91% { opacity:.9; transform:translate(4px,-2px) } 93% { opacity:0 } }
    @keyframes glitch2 { 0%,88%,100% { opacity:0; transform:translate(0,0) } 90% { opacity:.6; transform:translate(5px,2px) } 92% { opacity:.6; transform:translate(-3px,0) } 93% { opacity:0 } }
    @keyframes blink { 0%,50% { opacity:1 } 51%,100% { opacity:0 } }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.25 } }
  </style>
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="58%">
      <stop offset="0" stop-color="#FF2E4D" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#FF2E4D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2E4D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF2E4D" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FF2E4D" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" opacity="0.035"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="400" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="400" fill="#08080B"/>
    <rect width="1000" height="400" fill="url(#glow)"/>
    <rect width="1000" height="400" fill="url(#scan)"/>
    <rect x="0" y="0" width="1000" height="2" fill="url(#rule)"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="399" rx="14" fill="none" stroke="#22242E"/>

  <!-- corner status -->
  <g font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="11" letter-spacing="2">
    <circle class="pulse" cx="36" cy="38" r="4" fill="#FF2E4D"/>
    <text x="48" y="42" fill="#8A8D99">ACQUIRING</text>
    <text x="964" y="42" text-anchor="end" fill="#62656F">DFIR // TCS</text>
  </g>

  <!-- wordmark with occasional glitch split -->
  <g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="13" text-anchor="middle">
    <text class="g1" x="506" y="172" fill="#FF2E4D">KOTLA AVINASH</text>
    <text class="g2" x="506" y="172" fill="#7DF9FF" opacity="0">KOTLA AVINASH</text>
    <text x="506" y="172" fill="#F2F2F5">KOTLA AVINASH</text>
  </g>

  <!-- role tag between rules -->
  <rect x="360" y="206" width="96" height="1" fill="#5C1420"/>
  <text x="503" y="211" text-anchor="middle" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="13" letter-spacing="6" fill="#FF2E4D">DFIR</text>
  <rect x="544" y="206" width="96" height="1" fill="#5C1420"/>

  <text x="501" y="250" text-anchor="middle" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="11.5" letter-spacing="3.5" fill="#8A8D99">DIGITAL FORENSICS  ·  INCIDENT RESPONSE  ·  TOOL BUILDING</text>
  <text x="500" y="292" text-anchor="middle" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="17" fill="#F2F2F5">deleted <tspan fill="#FF2E4D">≠</tspan> gone<tspan class="blink" fill="#FF2E4D">▌</tspan></text>

  <!-- status bar -->
  <rect x="32" y="330" width="936" height="1" fill="#22242E"/>
  <rect x="496" y="326.5" width="7" height="7" fill="#FF2E4D" transform="rotate(45 499.5 330)"/>
  <g font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="10.5" letter-spacing="2">
    <circle class="pulse" cx="38" cy="364" r="3.5" fill="#FF2E4D"/>
    <text x="50" y="368" fill="#8A8D99">OPEN TO DFIR CONVERSATIONS<tspan class="blink" fill="#FF2E4D">_</tspan></text>
    <text x="964" y="368" text-anchor="end" fill="#62656F">WINDOWS · ANDROID · SQLITE · DISK IMAGES</text>
  </g>
</svg>
